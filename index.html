<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="style.css">
</head><body>

<div class="env" aria-hidden="true">
 <div class="sky"></div>
 <div class="moon"></div>
 <div class="cloud c1"></div>
 <div class="cloud c2"></div>
 <div class="fogL fog1"></div>
 <div class="fogL fog2"></div>
 <div class="fogL fog3"></div>
 <div class="skyline">
  <svg viewBox="0 0 400 90" preserveAspectRatio="none"><path d="M0 90V54l10-6 6 4 8-10 4 6 10-14 6 10 4-4 8 8 2-20 6 4V8l4-8 4 8v10l10 6 2-10 6 2 4 16 8-2 4-10 6 4 2 14 10-4 4 6 12-2 2-18 5-2V2l5 4 1 16 6 2 4-8 8 2 2 10 10-2 4-14 6 4 2 12 8-2V8l4-6 4 10v8l12 4 2-8 6 2 2 14 10 4V90Z" fill="#06060a"/></svg>
  <div class="window"></div>
 </div>
 <div class="raven" aria-hidden="true"><svg><use href="#raven-shape"/></svg></div>
</div>
<svg width="0" height="0" style="position:absolute">
 <symbol id="raven-shape" viewBox="0 0 34 34">
  <g class="wing l"><path d="M17 17c-4-3-9-4-14-2 4 1 8 3 11 6 1-1 2-2 3-4Z" fill="#4a453d"/></g>
  <g class="wing r"><path d="M17 17c4-3 9-4 14-2-4 1-8 3-11 6-1-1-2-2-3-4Z" fill="#4a453d"/></g>
  <ellipse cx="17" cy="17" rx="3.2" ry="2" fill="#4a453d"/>
 </symbol>
</svg>

<div class="gate-stage" id="gateStage" data-state="gate">
 <div class="gate-scene" aria-hidden="true">
  <div class="leaf left">
   <svg viewBox="0 0 220 700" preserveAspectRatio="xMaxYMid slice">
    <defs><linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
     <stop offset="0" stop-color="#030304"/><stop offset=".5" stop-color="#0c0b0d"/><stop offset="1" stop-color="#030304"/>
    </linearGradient></defs>
    <rect x="195" y="0" width="25" height="700" fill="url(#iron)"/>
    <path d="M195 0h25v700h-25 Z" fill="none" stroke="rgba(216,212,194,.08)" stroke-width="1"/>
    <g fill="url(#iron)">
      <path d="M20 90 10 40 0 90v610h20Z"/>
      <path d="M62 90 52 40 42 90v610h20Z"/>
      <path d="M104 90 94 40 84 90v610h20Z"/>
      <path d="M146 90 136 40 126 90v610h20Z"/>
      <path d="M188 90 178 40 168 90v610h20Z"/>
    </g>
    <rect x="0" y="150" width="210" height="16" fill="url(#iron)"/>
    <rect x="0" y="420" width="210" height="16" fill="url(#iron)"/>
    <path d="M210 300a60 60 0 0 0 0 120 Z" fill="url(#iron)" stroke="rgba(216,212,194,.12)" stroke-width="1.5"/>
    <circle cx="192" cy="360" r="7" fill="#1b1416" stroke="rgba(216,212,194,.18)" stroke-width="1"/>
   </svg>
  </div>
  <div class="leaf right">
   <svg viewBox="0 0 220 700" preserveAspectRatio="xMaxYMid slice">
    <rect x="195" y="0" width="25" height="700" fill="url(#iron)"/>
    <path d="M195 0h25v700h-25 Z" fill="none" stroke="rgba(216,212,194,.08)" stroke-width="1"/>
    <g fill="url(#iron)">
      <path d="M20 90 10 40 0 90v610h20Z"/>
      <path d="M62 90 52 40 42 90v610h20Z"/>
      <path d="M104 90 94 40 84 90v610h20Z"/>
      <path d="M146 90 136 40 126 90v610h20Z"/>
      <path d="M188 90 178 40 168 90v610h20Z"/>
    </g>
    <rect x="0" y="150" width="210" height="16" fill="url(#iron)"/>
    <rect x="0" y="420" width="210" height="16" fill="url(#iron)"/>
    <path d="M210 300a60 60 0 0 1 0 120 Z" fill="url(#iron)" stroke="rgba(216,212,194,.12)" stroke-width="1.5"/>
   </svg>
  </div>
 </div>
 <div class="gate-title">
  <div class="inner">
   <h1>Curse of Strahd</h1>
   <p>The mists remember every name that enters.</p>
   <button id="enterBtn" type="button">Enter Barovia</button>
  </div>
 </div>
 <div class="login-scene">
  <form class="box login" id="lf">
   <h2>Present Yourself</h2>
   <p class="sub">The gate will not open for strangers.</p>
   <label for="em">Email</label>
   <input id="em" type="email" autocomplete="username" required>
   <label for="pw">Password</label>
   <input id="pw" type="password" autocomplete="current-password" required>
   <p class="err" id="loginErr" role="alert"></p>
   <button>Sign in</button>
  </form>
 </div>
 <div class="burst" aria-hidden="true"></div>
</div>

<header><div><h1>Curse of Strahd</h1><p>Party companion. Working title.</p></div><div id="who"></div></header>
<main id="main" tabindex="-1"></main>

<script src="msg.js"></script>
<script src="dm.js"></script>

</body></html>
