<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curse of Strahd: Party Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0c11;--panel:#17131b;--line:#3a2f3d;--bone:#e8e1d0;--dim:#a79fae;--wine:#b03a4a;--brass:#c4a468;--mist:#8f98a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink) radial-gradient(ellipse at 50% -10%,#2a1a2c 0,var(--ink) 60%) no-repeat;color:var(--bone);font:18px/1.6 "Crimson Pro",Georgia,serif;min-height:100%}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;margin:0}
a{color:var(--brass)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--bone);color:var(--ink);padding:6px 10px;z-index:9}
header{max-width:1100px;margin:0 auto;padding:28px 20px 8px}
header h1{font-size:clamp(28px,4.5vw,46px);letter-spacing:.01em}
header p{margin:4px 0 0;color:var(--dim)}
nav{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:inherit;padding:10px 14px;cursor:pointer;min-height:44px}
nav button[aria-selected=true]{color:var(--bone);border-color:var(--wine)}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.state{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:26px}
.state div,.box{background:var(--panel);border:1px solid var(--line);padding:14px 16px;border-radius:4px}
.state b,.lab{display:block;color:var(--brass);font-size:15px;font-weight:600}
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.tile{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:1px solid var(--line);background:#000;cursor:pointer;overflow:hidden;color:inherit;text-align:left;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.tile span{position:absolute;inset:auto 0 0 0;padding:60px 16px 14px;background:linear-gradient(transparent,#0e0c11f2 70%)}
.tile h2{font-size:28px}.tile small{color:var(--dim);font-size:16px}
.hero{position:relative;height:clamp(220px,34vw,340px);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero div{position:absolute;inset:auto 0 0;padding:70px 20px 16px;background:linear-gradient(transparent,#0e0c11f5)}
.hero h2{font-size:clamp(30px,5vw,48px)}.hero p{margin:0;color:var(--dim)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center}
.abil div{border:1px solid var(--line);padding:8px 2px;border-radius:4px}
.abil b{display:block;font-size:24px;line-height:1.1}.abil i{font-style:normal;color:var(--dim);font-size:14px}
.abil .p{border-color:var(--brass)}
h3{font-size:22px;margin-bottom:8px}
.kv{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 10px}.kv span b{color:var(--brass);font-weight:600}
ul{margin:0;padding-left:20px}li{margin:2px 0}
.tr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.tr button,.reset{background:var(--ink);color:var(--bone);border:1px solid var(--brass);border-radius:4px;font:inherit;min-width:44px;min-height:44px;padding:0 12px;cursor:pointer}
.tr output{font-size:28px;min-width:3ch;text-align:center}
.gem{width:34px;height:34px;border-radius:50%;border:2px solid var(--wine);background:var(--wine);cursor:pointer;padding:0}
.gem[aria-pressed=true]{background:none}
blockquote{margin:10px 0 0;padding-left:14px;border-left:3px solid var(--wine);font-style:italic}
.note{color:var(--dim);font-size:16px;margin-top:22px}
.log article{border-left:2px solid var(--line);padding:0 0 18px 16px;margin-left:6px}
.pending{border-style:dashed}
@media(max-width:560px){.abil{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:no-preference){.hero img{transition:transform 1.2s}.hero:hover img{transform:scale(1.03)}}
</style></head><body>

const C={
M:{n:"Malakor Vane",cls:"Warlock 2, Variant Aasimar, Haunted One",pl:"Chris",fx:"52%",al:"Lawful Evil",faith:"Jergal, Lord of the End of Everything",
 q:"Chaos is inefficient. If we are to survive this land, we need structure, and control.",
 bio:"A senior clerk and estate liquidator who found a hidden second ledger tracking souls and cosmic debts. Jergal, the dispassionate Scribe of the Dead, hired him as a field agent to collect the centuries-old debt owed by Strahd von Zarovich. Malakor treats his party as valuable assets and Barovia as a bankrupt enterprise waiting to be liquidated.",
 full:1,ab:[["STR",8,-1],["DEX",13,1],["CON",14,2],["INT",10,0],["WIS",13,1,1],["CHA",17,3,1]],
 hp:17,ac:12,init:"+1",spd:"30 ft.",prof:"+2",dc:13,atk:"+5",slots:2,
 def:"Resistant to necrotic and radiant damage",
 skills:"Arcana +2, Deception +5, Intimidation +5, Survival +3",
 langs:"Abyssal, Celestial, Common, Elvish",
 cant:["Eldritch Blast (1d10+3 force)","Chill Touch","Sacred Flame","Spare the Dying","Light"],
 sp:["Hex","Protection from Evil and Good","Hellish Rebuke","Guiding Bolt (Magic Initiate, 1/long rest free)","Find Familiar (ritual)"],
 feat:["Pact of the Chain: an invisible fiend familiar that can attack on your Attack action","Agonizing Blast: Charisma modifier added to Eldritch Blast damage","Lessons of the First Ones: Magic Initiate (Cleric)","Magical Cunning: once per long rest, regain up to 1 Pact slot","Healing Hands: once per long rest, restore 2 HP by touch","Darkvision 60 ft."],
 inv:["Quarterstaff +1","Leather armor","2 daggers, sickle","Holy symbol, holy water","Abacus of the Unbroken Ledger","15 gp"],
 qs:["I did not come to Barovia to negotiate with its misery. I came to fulfill an obligation.","He was already dead the moment he turned, Alaric. You gave him a sword-length of peace; I gave him efficiency."]},
L:{n:"Lysander Vale",cls:"Half-elf Bard",pl:"Jonny",fx:"70%",
 bio:"Handsome but weary, with shoulder-length dark brown hair streaked with silver and piercing silver eyes. He carries a lute engraved with roses and ravens and a cracked red leather journal, and he is chasing the mystery of a family debt that reaches Strahd. He comforts the frightened and keeps the party talking."},
A:{n:"Sir Alaric Thorne",cls:"Human Oath of Vengeance Paladin, Haunted One",pl:"Aaron",fx:"68%",
 q:"Justice delayed is merely evil given time to grow.",
 bio:"A blacksmith's son who hid beneath the forge while monsters killed his family. After a spared vampire spawn escaped and killed again, he swore an oath to finish evil without hesitation and has hunted the undead ever since."}};
const J=[["Village of Barovia","The party met Doru, the priest's vampire spawn son, in the church crypt. Malakor's blasts brought him down and Alaric landed the killing blow. Lysander comforted the grieving priest. Alaric also destroyed an undead wolf on the road, and Count Strahd watched from the city gates."],
["The road to Vallaki","Escorting Ireena Kolyana toward Vallaki, the party passed a gallows tree where a corpse watched them and left an empty noose swinging. A pack of 11 wolves attacked. Strahd appeared to call one off when it lunged at Ireena. The party then reached the Vistani camp at Tser Pool and Madam Eva laid out the Tarokka cards."]];
const tabs=[["party","Party"],["M","Malakor"],["L","Lysander"],["A","Alaric"],["log","Journal"]];
const main=document.getElementById("main"),nav=document.getElementById("nav");
let st={hp:17,thp:0,slots:[0,0],hh:0,notes:""};
try{Object.assign(st,JSON.parse(localStorage.getItem("mv")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("mv",JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const li=a=>"<ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
function show(id){
 nav.innerHTML=tabs.map(([k,l])=>`<button role="tab" aria-selected="${k==id}" data-k="${k}">${l}</button>`).join("");
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.k));
 if(id=="party")main.innerHTML=`<div class="state"><div><b>Location</b>Vistani camp, Tser Pool</div><div><b>Active goal</b>Escort Ireena Kolyana to Vallaki</div><div><b>Party</b>Malakor, Alaric, Lysander, with Ireena</div></div><div class="party">${["M","L","A"].map(k=>`<button class="tile" data-k="${k}"><img src="${IMG[k]}" alt="Portrait of ${C[k].n}" style="object-position:${C[k].fx} 50%"><span><h2>${C[k].n}</h2><small>${C[k].cls}, played by ${C[k].pl}</small></span></button>`).join("")}</div><p class="note">Prototype. HP and slots you change are saved on this device only. Shared live data comes when we choose where to host.</p>`,main.querySelectorAll(".tile").forEach(b=>b.onclick=()=>show(b.dataset.k));
 else if(id=="log")main.innerHTML=`<h2>Journal</h2><div class="log">${J.map(([t,x])=>`<article><h3>${t}</h3><p>${x}</p></article>`).join("")}</div>`;
 else char(id);
 main.focus({preventScroll:true});scrollTo(0,0);
}
function char(k){const c=C[k];
 let h=`<div class="hero"><img src="${IMG[k]}" alt="Portrait of ${c.n}" style="object-position:${c.fx} 30%"><div><h2>${c.n}</h2><p>${c.cls}. Played by ${c.pl}.</p></div></div>`;
 if(!c.full){h+=`<div class="cols"><section class="box"><h3>Story</h3><p>${c.bio}</p>${c.q?`<blockquote>${c.q}</blockquote>`:""}</section><section class="box pending"><h3>Character sheet</h3><p>Waiting on the D&amp;D Beyond sheet from ${c.pl}. Stats, spells, tracker and notes will appear here.</p></section></div>`;main.innerHTML=h;return}
 h+=`<div class="cols"><section class="box" aria-labelledby="t1"><h3 id="t1">Combat tracker</h3>
 <div class="tr"><span class="lab">Hit points (max ${c.hp})</span></div>
 <div class="tr"><button id="hm" aria-label="Lose 1 hit point">-1</button><output id="hp" aria-live="polite"></output><button id="hpl" aria-label="Gain 1 hit point">+1</button><button id="hm5" aria-label="Lose 5 hit points">-5</button></div>
 <div class="tr"><span class="lab">Temp HP</span><button id="tm" aria-label="Lose 1 temp HP">-</button><output id="thp"></output><button id="tp" aria-label="Gain 1 temp HP">+</button></div>
 <div class="tr"><span class="lab">Pact slots (level 1)</span><span id="sl"></span></div>
 <div class="tr"><span class="lab">Healing Hands</span><button class="gem" id="hh" aria-label="Healing Hands used"></button></div>
 <button class="reset" id="lr">Long rest</button></section>
 <section class="box"><h3>Vitals</h3><div class="kv"><span><b>AC</b> ${c.ac}</span><span><b>Initiative</b> ${c.init}</span><span><b>Speed</b> ${c.spd}</span><span><b>Proficiency</b> ${c.prof}</span><span><b>Spell save DC</b> ${c.dc}</span><span><b>Spell attack</b> ${c.atk}</span></div><div class="abil" role="list">${c.ab.map(a=>`<div role="listitem" class="${a[3]?"p":""}"><i>${a[0]}${a[3]?" (save)":""}</i><b>${a[1]}</b><i>${a[2]>=0?"+":""}${a[2]}</i></div>`).join("")}</div><p>${c.def}.</p><p><span class="lab">Skills</span>${c.skills}</p><p><span class="lab">Languages</span>${c.langs}</p></section>
 <section class="box"><h3>Spells</h3><span class="lab">Cantrips</span>${li(c.cant)}<span class="lab" style="margin-top:10px">Level 1</span>${li(c.sp)}</section>
 <section class="box"><h3>Features</h3>${li(c.feat)}</section>
 <section class="box"><h3>Gear</h3>${li(c.inv)}</section>
 <section class="box"><h3>Story</h3><p>${c.bio}</p><p><span class="lab">Alignment and faith</span>${c.al}. ${c.faith}.</p><blockquote>${c.q}</blockquote>${c.qs.map(x=>`<blockquote>${x}</blockquote>`).join("")}</section>
 <section class="box"><h3>My notes</h3><label class="lab" for="nt">Private to this device</label><textarea id="nt" rows="7" style="width:100%;background:var(--ink);color:var(--bone);border:1px solid var(--line);border-radius:4px;font:inherit;padding:8px"></textarea></section></div>`;
 main.innerHTML=h;const $=i=>document.getElementById(i);
 const draw=()=>{$("hp").textContent=st.hp;$("thp").textContent=st.thp;$("hh").setAttribute("aria-pressed",!!st.hh);$("hh").setAttribute("aria-label","Healing Hands "+(st.hh?"used":"available"));
  $("sl").innerHTML=st.slots.map((u,i)=>`<button class="gem" data-i="${i}" aria-pressed="${!!u}" aria-label="Pact slot ${i+1} ${u?"used":"available"}"></button>`).join(" ");
  $("sl").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.slots[b.dataset.i]^=1;save();draw()});save()};
 const hp=d=>{if(d<0&&st.thp){const t=Math.min(st.thp,-d);st.thp-=t;d+=t}st.hp=Math.max(0,Math.min(c.hp,st.hp+d));draw()};
 $("hm").onclick=()=>hp(-1);$("hm5").onclick=()=>hp(-5);$("hpl").onclick=()=>hp(1);
 $("tm").onclick=()=>{st.thp=Math.max(0,st.thp-1);draw()};$("tp").onclick=()=>{st.thp++;draw()};
 $("hh").onclick=()=>{st.hh^=1;draw()};
 $("lr").onclick=()=>{st.hp=c.hp;st.thp=0;st.slots=[0,0];st.hh=0;draw()};
 $("nt").value=st.notes||"";$("nt").oninput=e=>{st.notes=e.target.value;save()};draw();
}
show("party");
</script></body></html>
